[package]
name = "auxide-io"
version = "0.1.0"
edition = "2021"
description = "Real-time safe audio I/O layer for auxide DSP graphs using CPAL"
license = "MIT OR Apache-2.0"

[dependencies]
auxide = "0.1.2"
cpal = "0.15"
anyhow = "1.0"

[features]
jack = ["cpal/jack"]

[[example]]
name = "play_tone"
path = "examples/play_tone.rs"

[[example]]
name = "play_sine"
path = "examples/play_sine.rs"

[profile.release]
panic = "abort"
